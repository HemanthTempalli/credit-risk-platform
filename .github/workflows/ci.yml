name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ streamlit_app/ --max-line-length=100 --ignore=E501,W503

      - name: Check imports
        run: python -c "from src.features import engineer_features, get_feature_matrix; print('✅ imports OK')"

      - name: Streamlit smoke test
        run: |
          pip install streamlit
          python -c "import streamlit; print('✅ Streamlit OK')"
